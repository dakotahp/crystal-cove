version: 2

updates:
  # Go modules: the MCP SDK, the OIDC library, the YAML and Markdown
  # parsers. Security fixes here reach the server directly.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # A release waits a week before it is proposed, so a hijacked version
    # has time to be caught. Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    assignees:
      - dakotahp
    groups:
      # One pull request for routine patches keeps the noise down; a major
      # version still arrives on its own, where it gets read properly.
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  # The Obsidian headless sync client and its dependency tree, pinned by
  # headless/package-lock.json. It holds the account token and vault
  # passwords, so every version change arrives as a reviewed pull request.
  - package-ecosystem: npm
    directory: /headless
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - javascript
    assignees:
      - dakotahp

  # Base images: the Go builder, the Node stage that installs the headless
  # client, and the Alpine runtime.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    assignees:
      - dakotahp

  # Actions used by the CI workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    assignees:
      - dakotahp
