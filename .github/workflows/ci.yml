name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  # A weekly rebuild picks up Alpine, Node and Go security patches that
  # land without any change to this repository.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Jobs get a read-only token unless they ask for more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" "$unformatted"
            exit 1
          fi
      - name: Check README table of contents
        run: node --test scripts/generate-toc.test.js
      - name: Vet
        run: go vet ./...
      - name: Test with coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic
      - name: Enforce 95% coverage
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{gsub("%", "", $3); print $3}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit !(t >= 95.0) }' || { echo "coverage ${total}% is below the 95% gate"; exit 1; }

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz the vault sandbox and the writable-note policy
        run: |
          go test ./internal/vault/ -run '^$' -fuzz '^FuzzResolveStaysInsideTheVault$' -fuzztime 20s
          go test ./internal/vault/ -run '^$' -fuzz '^FuzzReadNeverLeavesTheVault$' -fuzztime 20s
          go test ./internal/server/ -run '^$' -fuzz '^FuzzWritableNotesAreVisibleNotes$' -fuzztime 20s

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check for reachable known vulnerabilities
        run: ./scripts/vulncheck.sh

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the runtime image
        run: docker build -t obsidian-hosted-mcp:ci .
      - name: Smoke test the image
        run: ./scripts/smoke-test.sh obsidian-hosted-mcp:ci
      - name: Scan the image for fixable vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: obsidian-hosted-mcp:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

  publish:
    if: github.event_name == 'push' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/master')
    needs: [test, fuzz, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cached layers would skip apk add and keep old packages, so a
          # rebuild that is not triggered by a push starts from scratch.
          pull: true
          no-cache: ${{ github.event_name != 'push' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
