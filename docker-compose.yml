services:
  crystal-cove:
    image: ghcr.io/dakotahp/crystal-cove:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # The port inside the container. Leave it at 8080: to change the port
      # on the host, set HOST_PORT in .env instead.
      PORT: 8080
    ports:
      # Loopback by default: the container speaks plain HTTP, so only a
      # reverse proxy or tunnel on this host should reach it. Set
      # BIND_ADDRESS=0.0.0.0 only on a trusted network.
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-${PORT:-8080}}:8080"
    # Only the vaults volume is writable. The sync client writes nothing
    # outside its home folder; /tmp is a small in-memory safety net.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      # Persist synced vaults and the ob client's credential store so
      # restarts don't re-download every vault or re-register a device.
      - vaults:/home/obsidian
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 3m

volumes:
  vaults:
